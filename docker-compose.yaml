services:
  # --- The Brains & Engine -----------------------------------------------
  postgres:
    image: postgres:17.6
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DIRECTUS_DB_NAME=${DIRECTUS_DB_NAME}
      - DIRECTUS_DB_USER=${DIRECTUS_DB_USER}
      - DIRECTUS_DB_PASSWORD=${DIRECTUS_DB_PASSWORD}
      - GITEA_DB_NAME=${GITEA_DB_NAME}
      - GITEA_DB_USER=${GITEA_DB_USER}
      - GITEA_DB_PASSWORD=${GITEA_DB_PASSWORD}
    restart: none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2
    restart: none
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s # Check every 10 seconds
      timeout: 5s # Wait up to 5 seconds for a response
      retries: 3 # Try 3 times before marking as unhealthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    command: python manage.py runserver 0.0.0.0:8000
    # Run the container as the non-root user with UID/GID 1000.
    # This user must be created in your Dockerfile first.
    user: "1000:1000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: none

  celery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    command: celery -A automata worker -l info
    # Also run the celery worker as the same non-root user.
    user: "1000:1000"
    volumes:
      - .:/app
    env_file:
      - ./.env
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: none

  # --- External Services for the Workflow --------------------------------
  gitea:
    image: gitea/gitea:1.24.6-rootless
    volumes:
      - gitea_data:/var/lib/gitea
    ports:
      - "3000:3000"
      - "2222:22"
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${GITEA_DB_NAME}
      - GITEA__database__USER=${GITEA_DB_USER}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__ROOT_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: none

  focalboard:
    image: mattermost/focalboard:7.8.9
    ports:
      - "8065:8000"
    volumes:
      - focalboard_data:/data
    restart: none

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    restart: none

  # --- Example Target API (Simple CRM) -----------------------------------
  directus:
    image: directus/directus:11
    ports:
      - "8055:8055"
    environment:
      - KEY=${DIRECTUS_KEY}
      - SECRET=${DIRECTUS_SECRET}
      - ADMIN_EMAIL=${DIRECTUS_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${DIRECTUS_ADMIN_PASSWORD}
      - DB_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DIRECTUS_DB_NAME}
      - DB_USER=${DIRECTUS_DB_USER}
      - DB_PASSWORD=${DIRECTUS_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: none

volumes:
  postgres_data:
  gitea_data:
  focalboard_data:
  minio_data:

networks:
  default:
    name: automata_net
